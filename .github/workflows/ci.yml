name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drinking_buddies
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drinking_buddies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drinking_buddies
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - name: Apply database migrations
        run: bun run db:migrate
      - name: Smoke test server and protected messaging routes
        run: |
          bun run start > /tmp/drinking-buddies-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl --silent --fail http://127.0.0.1:3000/api/ready | grep -q '"database":"connected"'
          test "$(curl --silent --output /tmp/conversations.json --write-out '%{http_code}' http://127.0.0.1:3000/api/conversations)" = "401"
          test "$(curl --silent --output /tmp/messages.json --write-out '%{http_code}' http://127.0.0.1:3000/api/conversations/00000000-0000-4000-8000-000000000000/messages)" = "401"
          test "$(curl --silent --output /tmp/memories.json --write-out '%{http_code}' http://127.0.0.1:3000/api/memories)" = "401"
          curl --silent --fail http://127.0.0.1:3000/api/venues | grep -q '"venues"'

      - name: Integration test authenticated two-user messaging
        shell: bash
        run: |
          set -euo pipefail
          bun run start > /tmp/drinking-buddies-integration.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:3000/api/ready > /dev/null
          USER_A="10000000-0000-4000-8000-000000000001"
          USER_B="10000000-0000-4000-8000-000000000002"
          USER_C="10000000-0000-4000-8000-000000000003"
          MATCH_ID="20000000-0000-4000-8000-000000000001"
          CONVERSATION_ID="30000000-0000-4000-8000-000000000001"
          TOKEN_A="ci-user-a-$(openssl rand -hex 16)"
          TOKEN_B="ci-user-b-$(openssl rand -hex 16)"
          TOKEN_C="ci-user-c-$(openssl rand -hex 16)"
          HASH_A="$(printf %s "$TOKEN_A" | sha256sum | cut -d' ' -f1)"
          HASH_B="$(printf %s "$TOKEN_B" | sha256sum | cut -d' ' -f1)"
          HASH_C="$(printf %s "$TOKEN_C" | sha256sum | cut -d' ' -f1)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v user_a="$USER_A" -v user_b="$USER_B" -v user_c="$USER_C" \
            -v match_id="$MATCH_ID" -v conversation_id="$CONVERSATION_ID" \
            -v hash_a="$HASH_A" -v hash_b="$HASH_B" -v hash_c="$HASH_C" <<'SQL'
          INSERT INTO users (id,email,email_normalized,status,age_acknowledged_at,age_gate_version,email_verified_at)
          VALUES
            (:'user_a','ci-a@example.test','ci-a@example.test','active',now(),'ci-v1',now()),
            (:'user_b','ci-b@example.test','ci-b@example.test','active',now(),'ci-v1',now()),
            (:'user_c','ci-c@example.test','ci-c@example.test','active',now(),'ci-v1',now());
          INSERT INTO profiles (user_id,display_name) VALUES
            (:'user_a','CI User A'), (:'user_b','CI User B'), (:'user_c','CI User C');
          INSERT INTO matches (id,user_low_id,user_high_id)
          VALUES (:'match_id',:'user_a',:'user_b');
          INSERT INTO conversations (id,kind,match_id)
          VALUES (:'conversation_id','match',:'match_id');
          INSERT INTO auth_sessions (user_id,token_hash,expires_at)
          VALUES
            (:'user_a',:'hash_a',now() + interval '1 hour'),
            (:'user_b',:'hash_b',now() + interval '1 hour'),
            (:'user_c',:'hash_c',now() + interval '1 hour');
          SQL
          BASE_URL="http://127.0.0.1:3000"
          test "$(curl --silent --output /tmp/send-a.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/conversations/$CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_A" -H 'Content-Type: application/json' \
            --data '{"body":"Hello from user A"}')" = "201"
          grep -q 'Hello from user A' /tmp/send-a.json
          test "$(curl --silent --output /tmp/history-b.json --write-out '%{http_code}' \
            "$BASE_URL/api/conversations/$CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_B")" = "200"
          grep -q 'Hello from user A' /tmp/history-b.json
          test "$(curl --silent --output /tmp/send-b.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/conversations/$CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_B" -H 'Content-Type: application/json' \
            --data '{"body":"Reply from user B"}')" = "201"
          grep -q 'Reply from user B' /tmp/send-b.json
          test "$(curl --silent --output /tmp/outsider.json --write-out '%{http_code}' \
            "$BASE_URL/api/conversations/$CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_C")" = "404"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v user_a="$USER_A" -v user_b="$USER_B" <<'SQL'
          INSERT INTO user_blocks (blocker_id,blocked_id) VALUES (:'user_a',:'user_b');
          SQL
          test "$(curl --silent --output /tmp/blocked.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/conversations/$CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_B" -H 'Content-Type: application/json' \
            --data '{"body":"This must be blocked"}')" = "404"
          echo "Authenticated messaging integration tests passed."

          STARTS_AT="$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%SZ)"
          ENDS_AT="$(date -u -d '+2 days 3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          MEETUP_PAYLOAD="$(jq -n --arg title "CI meetup workflow" --arg area "Westlands, Nairobi" --arg startsAt "$STARTS_AT" --arg endsAt "$ENDS_AT" '{title:$title,area:$area,startsAt:$startsAt,endsAt:$endsAt,capacity:2,visibility:"approval_required",description:"Automated meetup workflow integration test"}')"
          test "$(curl --silent --output /tmp/meetup-create.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups" -H "Cookie: db_session=$TOKEN_A" \
            -H 'Content-Type: application/json' --data "$MEETUP_PAYLOAD")" = "201"
          MEETUP_ID="$(jq -r '.data.meetup.id' /tmp/meetup-create.json)"
          GROUP_CONVERSATION_ID="$(jq -r '.data.meetup.conversationId' /tmp/meetup-create.json)"
          test -n "$MEETUP_ID" && test "$MEETUP_ID" != "null"
          test -n "$GROUP_CONVERSATION_ID" && test "$GROUP_CONVERSATION_ID" != "null"
          test "$(curl --silent --output /tmp/meetup-join-b.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups/$MEETUP_ID/join" -H "Cookie: db_session=$TOKEN_B")" = "200"
          grep -q '"membershipStatus":"requested"' /tmp/meetup-join-b.json
          test "$(curl --silent --output /tmp/meetup-join-c.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups/$MEETUP_ID/join" -H "Cookie: db_session=$TOKEN_C")" = "200"
          test "$(curl --silent --output /tmp/meetup-approve-b.json --write-out '%{http_code}' \
            -X PATCH "$BASE_URL/api/meetups/$MEETUP_ID/members/$USER_B" \
            -H "Cookie: db_session=$TOKEN_A" -H 'Content-Type: application/json' \
            --data '{"status":"approved"}')" = "200"
          test "$(curl --silent --output /tmp/meetup-decline-c.json --write-out '%{http_code}' \
            -X PATCH "$BASE_URL/api/meetups/$MEETUP_ID/members/$USER_C" \
            -H "Cookie: db_session=$TOKEN_A" -H 'Content-Type: application/json' \
            --data '{"status":"declined"}')" = "200"
          test "$(curl --silent --output /tmp/meetup-conversations-b.json --write-out '%{http_code}' \
            "$BASE_URL/api/conversations" -H "Cookie: db_session=$TOKEN_B")" = "200"
          grep -q "$GROUP_CONVERSATION_ID" /tmp/meetup-conversations-b.json
          test "$(curl --silent --output /tmp/meetup-message.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/conversations/$GROUP_CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_B" -H 'Content-Type: application/json' \
            --data '{"body":"Hello meetup group"}')" = "201"
          test "$(curl --silent --output /tmp/meetup-outsider.json --write-out '%{http_code}' \
            "$BASE_URL/api/conversations/$GROUP_CONVERSATION_ID/messages" \
            -H "Cookie: db_session=$TOKEN_C")" = "404"
          echo "Meetup creation, approval, membership and group chat integration tests passed."

          PAID_MEETUP_PAYLOAD="$(jq -n --arg title "CI paid meetup workflow" --arg area "Westlands, Nairobi" --arg startsAt "$STARTS_AT" '{title:$title,area:$area,startsAt:$startsAt,capacity:10,visibility:"public",pricingType:"paid",priceMinor:150000,currency:"KES",refundPolicy:{kind:"host_policy",refundBeforeHours:24,refundPercentage:100}}')"
          test "$(curl --silent --output /tmp/paid-meetup.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups" -H "Cookie: db_session=$TOKEN_A" \
            -H 'Content-Type: application/json' --data "$PAID_MEETUP_PAYLOAD")" = "201"
          grep -q '"pricingType":"paid"' /tmp/paid-meetup.json
          grep -q '"priceMinor":150000' /tmp/paid-meetup.json
          PAID_MEETUP_ID="$(jq -r '.data.meetup.id' /tmp/paid-meetup.json)"
          BOOKING_PAYLOAD='{"quantity":1,"phone":"254712345678","idempotencyKey":"ci-paid-booking-user-b-001"}'
          test "$(curl --silent --output /tmp/paid-booking-disabled.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups/$PAID_MEETUP_ID/bookings" -H "Cookie: db_session=$TOKEN_B" \
            -H 'Content-Type: application/json' --data "$BOOKING_PAYLOAD")" = "503"
          grep -q 'MPESA_DISABLED' /tmp/paid-booking-disabled.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM meetup_bookings WHERE meetup_id='$PAID_MEETUP_ID'")" = "0"
          test "$(curl --silent --output /tmp/paid-meetup-join.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups/$PAID_MEETUP_ID/join" -H "Cookie: db_session=$TOKEN_C")" = "409"
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM host_subscriptions WHERE user_id='$USER_A' AND plan='free_trial' AND status='trialing'")" = "1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v user_a="$USER_A" <<'SQL'
          UPDATE host_subscriptions SET status='expired', current_period_start=now() - interval '2 seconds', current_period_end=now() - interval '1 second' WHERE user_id=:'user_a';
          SQL
          test "$(curl --silent --output /tmp/expired-paid-meetup.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/meetups" -H "Cookie: db_session=$TOKEN_A" \
            -H 'Content-Type: application/json' --data "$PAID_MEETUP_PAYLOAD")" = "403"
          echo "Paid meetup pricing, one-time free trial and expired-membership gate tests passed."

          # M3 discovery intent modes: verify friendship and dating filters return compatible profiles.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v user_a="$USER_A" <<'SQL'
          UPDATE profiles
          SET connection_intents='["friendship","social_and_dating"]'::jsonb,
              preferred_genders='[]'::jsonb
          WHERE user_id=:'user_a';
          SQL
          test "$(curl --silent --output /tmp/discovery-friendship.json --write-out '%{http_code}' \
            "$BASE_URL/api/discovery?mode=friendship" -H "Cookie: db_session=$TOKEN_C")" = "200"
          grep -q 'CI User A' /tmp/discovery-friendship.json
          test "$(curl --silent --output /tmp/discovery-dating.json --write-out '%{http_code}' \
            "$BASE_URL/api/discovery?mode=dating" -H "Cookie: db_session=$TOKEN_C")" = "200"
          grep -q 'CI User A' /tmp/discovery-dating.json

          # M4 spontaneous Go Out plans: create, join and list with member counts.
          GO_OUT_STARTS_AT="$(date -u -d '+3 days' +%Y-%m-%dT%H:%M:%SZ)"
          GO_OUT_PAYLOAD="$(jq -n --arg title "CI Friday plans" --arg area "Westlands, Nairobi" --arg startsAt "$GO_OUT_STARTS_AT" '{title:$title,area:$area,startsAt:$startsAt,capacity:4,visibility:"public",description:"Automated Go Out integration test"}')"
          test "$(curl --silent --output /tmp/go-out-create.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/go-out" -H "Cookie: db_session=$TOKEN_C" \
            -H 'Content-Type: application/json' --data "$GO_OUT_PAYLOAD")" = "201"
          GO_OUT_ID="$(jq -r '.data.plan.id' /tmp/go-out-create.json)"
          test -n "$GO_OUT_ID" && test "$GO_OUT_ID" != "null"
          test "$(curl --silent --output /tmp/go-out-join.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/go-out/$GO_OUT_ID/join" -H "Cookie: db_session=$TOKEN_B")" = "200"
          test "$(curl --silent --output /tmp/go-out-list.json --write-out '%{http_code}' \
            "$BASE_URL/api/go-out" -H "Cookie: db_session=$TOKEN_B")" = "200"
          grep -q 'CI Friday plans' /tmp/go-out-list.json
          grep -q '"goingCount":2' /tmp/go-out-list.json

          # M4 permanent squads: create, invite by email, accept and use squad discussion.
          SQUAD_PAYLOAD='{"name":"CI Friday Crew","description":"Automated squad integration test","area":"Nairobi","visibility":"private"}'
          test "$(curl --silent --output /tmp/squad-create.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/squads" -H "Cookie: db_session=$TOKEN_A" \
            -H 'Content-Type: application/json' --data "$SQUAD_PAYLOAD")" = "201"
          SQUAD_ID="$(jq -r '.data.squad.id' /tmp/squad-create.json)"
          test -n "$SQUAD_ID" && test "$SQUAD_ID" != "null"
          test "$(curl --silent --output /tmp/squad-invite.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/squads/$SQUAD_ID/invitations" -H "Cookie: db_session=$TOKEN_A" \
            -H 'Content-Type: application/json' --data '{"email":"ci-b@example.test"}')" = "200"
          test "$(curl --silent --output /tmp/squad-invited-list.json --write-out '%{http_code}' \
            "$BASE_URL/api/squads" -H "Cookie: db_session=$TOKEN_B")" = "200"
          grep -q '"myStatus":"invited"' /tmp/squad-invited-list.json
          test "$(curl --silent --output /tmp/squad-join.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/squads/$SQUAD_ID/join" -H "Cookie: db_session=$TOKEN_B")" = "200"
          test "$(curl --silent --output /tmp/squad-message.json --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/squads/$SQUAD_ID/messages" -H "Cookie: db_session=$TOKEN_B" \
            -H 'Content-Type: application/json' --data '{"body":"See you Friday, crew!"}')" = "201"
          test "$(curl --silent --output /tmp/squad-history.json --write-out '%{http_code}' \
            "$BASE_URL/api/squads/$SQUAD_ID/messages" -H "Cookie: db_session=$TOKEN_A")" = "200"
          grep -q 'See you Friday, crew!' /tmp/squad-history.json
          echo "M3 discovery modes and M4 Go Out plans, private squad invitations and squad discussion integration tests passed."

          # Keep social discovery and community-planning integration coverage in the main CI gate.
