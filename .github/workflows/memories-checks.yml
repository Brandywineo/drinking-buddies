name: Memories implementation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/memories-social-experience]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
